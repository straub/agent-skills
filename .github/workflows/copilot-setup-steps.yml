name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # Clone the repository to install dependencies
      contents: read
      # Enable GitHub Models access for running evals
      models: read

    # Define steps to prepare the environment before Copilot starts working.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Set up Python for skills-ref validation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Clone skills-ref tool
        run: |
          git clone --depth 1 https://github.com/agentskills/agentskills.git /tmp/agentskills

      - name: Install skills-ref
        run: |
          cd /tmp/agentskills/skills-ref
          uv sync

      # Set up Node.js for Promptfoo evaluations (if package.json exists)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install JavaScript dependencies
        if: hashFiles('package.json') != ''
        run: npm ci
